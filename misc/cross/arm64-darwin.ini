[binaries]
c = ['clang', '-target', 'arm64-apple-darwin']
objc = ['clang', '-target', 'arm64-apple-darwin']
cpp = ['clang++', '-target', 'arm64-apple-darwin']
cmake = 'cmake'
rust = 'rustc'
strip = 'strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[build_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
c_args = ['-arch', 'arm64', '-mmacosx-version-min=15.0']
c_link_args = ['-arch', 'arm64', '-mmacosx-version-min=15.0']
objc_args = ['-arch', 'arm64', '-mmacosx-version-min=15.0']
objc_link_args = ['-arch', 'arm64', '-mmacosx-version-min=15.0']
cpp_args = ['-arch', 'arm64']
cpp_link_args = ['-arch', 'arm64', '-mmacosx-version-min=15.0']

[project options]
enable_sokol = 'enabled'
sokol_backend = 'metal'
