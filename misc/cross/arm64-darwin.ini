[binaries]
c = ['clang', '-target', 'arm64-apple-darwin']
objc = ['clang', '-target', 'arm64-apple-darwin']
strip = 'strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[build_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
c_args = ['-arch', 'arm64']
c_link_args = ['-arch', 'arm64']
