[constants]
cflags = ['-msimd128', '-mbulk-memory', '-mmutable-globals', '-msign-ext', '-mnontrapping-fptoint']

[properties]
needs_exe_wrapper = true
source_map_base = 'http://localhost:6931/'

[project options]
tests = 'disabled'

[built-in options]
b_ndebug = 'true'
b_pie = false
b_pch = true
b_staticpic = false
c_thread_count = 0
cpp_eh = 'none'
cpp_rtti = false
cpp_thread_count = 0
default_library = 'static'
optimization = 's'
debug = false

[sdl3-cmake-wrapper:project options]
win32_threads = 'disabled'
pthreads = 'disabled'

[host_machine]
cpu = 'post-mvp'
cpu_family = 'wasm32'
endian = 'little'
system = 'emscripten'
