# Build system "borrowed" by Taisei Project

# Go check the project out (I'm a Touhou fan):
# https://github.com/taisei-project/taisei

[constants]
 # TODO (Framework): Add a way to set the toolchain path dynamically
toolchain = ''
cflags = ['-mbulk-memory', '-mmutable-globals', '-msign-ext', '-mnontrapping-fptoint']
ldflags = ['-v', '-sWASM_BIGINT', '-sMIN_FIREFOX_VERSION=89', '-sMIN_CHROME_VERSION=91']

[binaries]
ar = toolchain / 'emar'
c = toolchain / 'emcc'
cpp = toolchain / 'em++'
ranlib = toolchain / 'emranlib'
file_packager = toolchain / 'tools/file_packager'


[properties]
needs_exe_wrapper = true
source_map_base = 'http://localhost:6931/'

[project options]
tests = 'disabled'

[built-in options]
c_args = cflags
cpp_args = cflags
b_ndebug = 'true'
b_pie = false
b_pch = true
b_staticpic = false
c_thread_count = 0
c_link_args = ldflags
cpp_link_args = ldflags
cpp_eh = 'none'
cpp_rtti = false
cpp_thread_count = 0
default_library = 'static'
optimization = 's'
debug = false

[sdl3-cmake-wrapper:project options]
win32_threads = 'disabled'
pthreads = 'disabled'

[host_machine]
cpu = 'post-mvp'
cpu_family = 'wasm32'
endian = 'little'
system = 'emscripten'
